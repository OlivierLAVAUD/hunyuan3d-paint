# Tooling configuration only.
#
# There is deliberately no [project] table here: requirements.txt and the
# Dockerfile are the single source of truth for dependencies, and duplicating
# them in a second format is how environments drift apart.

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # bugbear
    "SIM",  # simplify
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "TRY",  # exception handling
    "PLW",  # pylint warnings
]
ignore = [
    # FastAPI's dependency injection *is* a call in a default argument.
    "B008",
    # Long, contextual error messages are the point of app/exceptions.py.
    "TRY003",
    # Raising from inside a try block that also does cleanup is intentional
    # (see JobStore.save_upload).
    "TRY301",
]

[tool.ruff.lint.per-file-ignores]
"third_party/**" = ["ALL"]  # vendored upstream code, never linted
"tests/**" = ["RUF012"]
# The front-end's copy is full of deliberate typography — em dashes, a "×"
# between extents, arrows, "·" separators — not ambiguous characters that
# slipped in.
"ui/**" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette's TestClient still uses the anyio alias it deprecates itself.
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::DeprecationWarning:anyio",
]
